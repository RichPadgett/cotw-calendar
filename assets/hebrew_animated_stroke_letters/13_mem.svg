<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">Mem (מ) animated Hebrew stroke order</title>
<desc id="desc">Hand-drawn instructional animation showing the suggested stroke sequence for writing Mem.</desc>
<defs>
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="4" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/></filter>
  <style>
    .guide { fill:none; stroke:#d7d7d7; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .ink { fill:none; stroke:#161616; stroke-width:16; stroke-linecap:round; stroke-linejoin:round; filter:url(#wobble); }
    .start { fill:#fff; stroke:#555; stroke-width:2; }
    .num { font:700 14px system-ui,sans-serif; fill:#222; text-anchor:middle; dominant-baseline:central; }
    .label { font:600 16px system-ui,sans-serif; fill:#555; }
  </style>
</defs>
<rect width="400" height="400" rx="28" fill="#faf8f3"/>
<path d="M70 330 H330" stroke="#e8e1d5" stroke-width="2" stroke-dasharray="7 7"/>
<text x="20" y="28" class="label">Mem · מ</text>

<path class="guide" d="M300 111 C255 103 211 104 162 112"/>
<path class="guide" d="M292 113 C292 170 291 235 289 303"/>
<path class="guide" d="M162 112 C185 145 206 181 220 221"/>
<path class="guide" d="M220 221 C237 181 258 145 288 114"/>
<path class="guide" d="M160 113 C158 171 158 238 156 304"/>
<path class="ink" d="M300 111 C255 103 211 104 162 112" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="0.0s;loop.begin+0.0s" fill="freeze"/></path>
<circle class="start" cx="300.0" cy="111.0" r="11"/><text class="num" x="300.0" y="111.0">1</text>
<path class="ink" d="M292 113 C292 170 291 235 289 303" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="0.95s;loop.begin+0.95s" fill="freeze"/></path>
<circle class="start" cx="292.0" cy="113.0" r="11"/><text class="num" x="292.0" y="113.0">2</text>
<path class="ink" d="M162 112 C185 145 206 181 220 221" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="1.9s;loop.begin+1.9s" fill="freeze"/></path>
<circle class="start" cx="162.0" cy="112.0" r="11"/><text class="num" x="162.0" y="112.0">3</text>
<path class="ink" d="M220 221 C237 181 258 145 288 114" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="2.8499999999999996s;loop.begin+2.8499999999999996s" fill="freeze"/></path>
<circle class="start" cx="220.0" cy="221.0" r="11"/><text class="num" x="220.0" y="221.0">4</text>
<path class="ink" d="M160 113 C158 171 158 238 156 304" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="3.8s;loop.begin+3.8s" fill="freeze"/></path>
<circle class="start" cx="160.0" cy="113.0" r="11"/><text class="num" x="160.0" y="113.0">5</text>
<rect x="0" y="0" width="1" height="1" fill="none"><animate id="loop" attributeName="x" from="0" to="0" dur="5.95s" begin="0s;loop.end"/></rect>
</svg>