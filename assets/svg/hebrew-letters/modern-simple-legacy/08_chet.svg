<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">Chet (ח) animated Hebrew stroke order</title>
<desc id="desc">Hand-drawn instructional animation showing the suggested stroke sequence for writing Chet.</desc>
<defs>
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="4" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/></filter>
  <style>
    .guide { fill:none; stroke:#d7d7d7; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .ink { fill:none; stroke:#161616; stroke-width:16; stroke-linecap:round; stroke-linejoin:round; filter:url(#wobble); }
    .start { fill:#fff; stroke:#555; stroke-width:2; }
    .num { font:700 14px system-ui,sans-serif; fill:#222; text-anchor:middle; dominant-baseline:central; }
    .label { font:600 16px system-ui,sans-serif; fill:#555; }
  </style>
</defs>
<rect width="400" height="400" rx="28" fill="#faf8f3"/>
<path d="M70 330 H330" stroke="#e8e1d5" stroke-width="2" stroke-dasharray="7 7"/>
<text x="20" y="28" class="label">Chet · ח</text>

<path class="guide" d="M300 108 C251 102 207 103 154 110"/>
<path class="guide" d="M291 111 C294 169 292 239 289 306"/>
<path class="guide" d="M159 111 C158 170 158 238 157 306"/>
<path class="ink" d="M300 108 C251 102 207 103 154 110" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="0.0s;loop.begin+0.0s" fill="freeze"/></path>
<circle class="start" cx="300.0" cy="108.0" r="11"/><text class="num" x="300.0" y="108.0">1</text>
<path class="ink" d="M291 111 C294 169 292 239 289 306" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="0.95s;loop.begin+0.95s" fill="freeze"/></path>
<circle class="start" cx="291.0" cy="111.0" r="11"/><text class="num" x="291.0" y="111.0">2</text>
<path class="ink" d="M159 111 C158 170 158 238 157 306" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.85s" begin="1.9s;loop.begin+1.9s" fill="freeze"/></path>
<circle class="start" cx="159.0" cy="111.0" r="11"/><text class="num" x="159.0" y="111.0">3</text>
<rect x="0" y="0" width="1" height="1" fill="none"><animate id="loop" attributeName="x" from="0" to="0" dur="4.05s" begin="0s;loop.end"/></rect>
</svg>