<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Animated Paleo-Hebrew Resh</title>
  <desc id="desc">Historically inspired educational calligraphic animation with tapered broad-pen styling and sequential stroke order.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="28" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M240 500 C240.0 458.3 208.3 291.7 240 250 C271.7 208.3 386.7 238.3 430 250 C473.3 261.7 488.3 278.3 500 320 C511.7 361.7 500.0 470.0 500 500" fill="none" stroke="white" stroke-width="74" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.21s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#f7f1e5"/>
  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>
  <g opacity=".13"><path d="M240 500 C240.0 458.3 208.3 291.7 240 250 C271.7 208.3 386.7 238.3 430 250 C473.3 261.7 488.3 278.3 500 320 C511.7 361.7 500.0 470.0 500 500" fill="none" stroke="#2c2218" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M240 500 C240.0 458.3 208.3 291.7 240 250 C271.7 208.3 386.7 238.3 430 250 C473.3 261.7 488.3 278.3 500 320 C511.7 361.7 500.0 470.0 500 500" fill="none" stroke="#24170f" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M240 500 C240.0 458.3 208.3 291.7 240 250 C271.7 208.3 386.7 238.3 430 250 C473.3 261.7 488.3 278.3 500 320 C511.7 361.7 500.0 470.0 500 500" fill="none" stroke="#3b281a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g></g>
  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9"><path d="M240 500 L240.0 362.5" marker-end="url(#arrow)"/></g>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
      <circle cx="240" cy="500" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="240" y="507" fill="#5f472a">1</text></g>
  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#36271a">Resh 𐤓 — Modern ר</text>
  <text x="360" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b5943">Transliteration: r • 1 strokes • calligraphic teaching form</text>
  <set attributeName="data-duration" to="2.04" begin="0s"/>
</svg>