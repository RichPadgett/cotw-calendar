<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Animated Paleo-Hebrew Tet</title>
  <desc id="desc">Historically inspired educational calligraphic animation with tapered broad-pen styling and sequential stroke order.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M245 260 C264.2 253.3 321.7 220.0 360 220 C398.3 220.0 453.3 231.7 475 260 C496.7 288.3 497.5 350.0 490 390 C482.5 430.0 463.3 481.7 430 500 C396.7 518.3 323.3 518.3 290 500 C256.7 481.7 237.5 430.0 230 390 C222.5 350.0 242.5 281.7 245 260" fill="none" stroke="white" stroke-width="74" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.57s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal2">
      <path d="M300 320 L420 440" fill="none" stroke="white" stroke-width="74" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.97s" begin="2.10s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#f7f1e5"/>
  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>
  <g opacity=".13"><path d="M245 260 C264.2 253.3 321.7 220.0 360 220 C398.3 220.0 453.3 231.7 475 260 C496.7 288.3 497.5 350.0 490 390 C482.5 430.0 463.3 481.7 430 500 C396.7 518.3 323.3 518.3 290 500 C256.7 481.7 237.5 430.0 230 390 C222.5 350.0 242.5 281.7 245 260" fill="none" stroke="#2c2218" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 320 L420 440" fill="none" stroke="#2c2218" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M245 260 C264.2 253.3 321.7 220.0 360 220 C398.3 220.0 453.3 231.7 475 260 C496.7 288.3 497.5 350.0 490 390 C482.5 430.0 463.3 481.7 430 500 C396.7 518.3 323.3 518.3 290 500 C256.7 481.7 237.5 430.0 230 390 C222.5 350.0 242.5 281.7 245 260" fill="none" stroke="#24170f" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M245 260 C264.2 253.3 321.7 220.0 360 220 C398.3 220.0 453.3 231.7 475 260 C496.7 288.3 497.5 350.0 490 390 C482.5 430.0 463.3 481.7 430 500 C396.7 518.3 323.3 518.3 290 500 C256.7 481.7 237.5 430.0 230 390 C222.5 350.0 242.5 281.7 245 260" fill="none" stroke="#3b281a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal2)">
        <path d="M300 320 L420 440" fill="none" stroke="#24170f" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M300 320 L420 440" fill="none" stroke="#3b281a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g></g>
  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9"><path d="M245 260 L308.2 238.0" marker-end="url(#arrow)"/><path d="M300 320 L366.0 386.0" marker-end="url(#arrow)"/></g>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
      <circle cx="245" cy="260" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="245" y="267" fill="#5f472a">1</text>
      <circle cx="300" cy="320" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="300" y="327" fill="#5f472a">2</text></g>
  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#36271a">Tet 𐤈 — Modern ט</text>
  <text x="360" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b5943">Transliteration: ṭ • 2 strokes • calligraphic teaching form</text>
  <set attributeName="data-duration" to="3.55" begin="0s"/>
</svg>