<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"
 role="img" aria-labelledby="title desc">
  <title id="title">Animated Paleo-Hebrew Zayin</title>
  <desc id="desc">Calligraphic teaching animation rendered with the shared Hebrew alphabet visual system.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2"
                    seed="65" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M250 240 L470 240" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal2">
      <path d="M360 240 L360 500" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="1.57s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal3">
      <path d="M300 315 L420 315" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="2.79s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>

  <rect width="720" height="720" fill="#f7f1e5"/>

  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>

  <g opacity=".13"><path d="M250 240 L470 240" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 240 L360 500" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 315 L420 315" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M250 240 L470 240" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M250 240 L470 240" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M250 240 L470 240" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal2)">
        <path d="M360 240 L360 500" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M360 240 L360 500" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M360 240 L360 500" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal3)">
        <path d="M300 315 L420 315" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M300 315 L420 315" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M300 315 L420 315" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g></g>

  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9">
    <path d="M250 240 L371.0 240.0" marker-end="url(#arrow)"/><path d="M360 240 L360.0 383.0" marker-end="url(#arrow)"/><path d="M300 315 L366.0 315.0" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    
      <circle cx="250" cy="240" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="250" y="247" fill="#5f472a">1</text>
      <circle cx="360" cy="240" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="360" y="247" fill="#5f472a">2</text>
      <circle cx="300" cy="315" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="300" y="322" fill="#5f472a">3</text>
  </g>

  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif"
        font-size="30" fill="#36271a">Zayin 𐤆</text>
  <text x="360" y="654" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="16" fill="#6b5943">Modern ז • z • 3 strokes</text>
</svg>