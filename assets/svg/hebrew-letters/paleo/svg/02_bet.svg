<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Animated Paleo-Hebrew Bet</title>
  <desc id="desc">Historically inspired educational calligraphic animation with tapered broad-pen styling and sequential stroke order.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M230 235 L230 500" fill="none" stroke="white" stroke-width="68" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.97s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal2">
      <path d="M230 250 C270.0 250.0 425.0 241.7 470 250 C515.0 258.3 495.0 291.7 500 300" fill="none" stroke="white" stroke-width="68" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.97s" begin="1.50s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal3">
      <path d="M230 500 C270.0 500.0 425.0 508.3 470 500 C515.0 491.7 495.0 458.3 500 450" fill="none" stroke="white" stroke-width="68" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.97s" begin="2.65s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal4">
      <path d="M500 300 L500 450" fill="none" stroke="white" stroke-width="68" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.97s" begin="3.80s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#f7f1e5"/>
  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>
  <g opacity=".13"><path d="M230 235 L230 500" fill="none" stroke="#2c2218" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 250 C270.0 250.0 425.0 241.7 470 250 C515.0 258.3 495.0 291.7 500 300" fill="none" stroke="#2c2218" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 500 C270.0 500.0 425.0 508.3 470 500 C515.0 491.7 495.0 458.3 500 450" fill="none" stroke="#2c2218" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 300 L500 450" fill="none" stroke="#2c2218" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M230 235 L230 500" fill="none" stroke="#24170f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M230 235 L230 500" fill="none" stroke="#3b281a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal2)">
        <path d="M230 250 C270.0 250.0 425.0 241.7 470 250 C515.0 258.3 495.0 291.7 500 300" fill="none" stroke="#24170f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M230 250 C270.0 250.0 425.0 241.7 470 250 C515.0 258.3 495.0 291.7 500 300" fill="none" stroke="#3b281a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal3)">
        <path d="M230 500 C270.0 500.0 425.0 508.3 470 500 C515.0 491.7 495.0 458.3 500 450" fill="none" stroke="#24170f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M230 500 C270.0 500.0 425.0 508.3 470 500 C515.0 491.7 495.0 458.3 500 450" fill="none" stroke="#3b281a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal4)">
        <path d="M500 300 L500 450" fill="none" stroke="#24170f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M500 300 L500 450" fill="none" stroke="#3b281a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g></g>
  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9"><path d="M230 235 L230.0 380.8" marker-end="url(#arrow)"/><path d="M230 250 L362.0 250.0" marker-end="url(#arrow)"/><path d="M230 500 L362.0 500.0" marker-end="url(#arrow)"/><path d="M500 300 L500.0 382.5" marker-end="url(#arrow)"/></g>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
      <circle cx="230" cy="235" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="230" y="242" fill="#5f472a">1</text>
      <circle cx="230" cy="250" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="230" y="257" fill="#5f472a">2</text>
      <circle cx="230" cy="500" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="230" y="507" fill="#5f472a">3</text>
      <circle cx="500" cy="300" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="500" y="307" fill="#5f472a">4</text></g>
  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#36271a">Bet 𐤁 — Modern ב</text>
  <text x="360" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b5943">Transliteration: b/v • 4 strokes • calligraphic teaching form</text>
  <set attributeName="data-duration" to="5.25" begin="0s"/>
</svg>