<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Animated Hebrew Resh</title>
  <desc id="desc">Educational Hebrew calligraphic animation with sequential broad-pen stroke order.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="44" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M260 250 C290.8 250.0 405.0 240.8 445 250 C485.0 259.2 490.8 263.3 500 305 C509.2 346.7 500.0 467.5 500 500" fill="none" stroke="white" stroke-width="72" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.09s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#f7f1e5"/>
  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>
  <g opacity=".13"><path d="M260 250 C290.8 250.0 405.0 240.8 445 250 C485.0 259.2 490.8 263.3 500 305 C509.2 346.7 500.0 467.5 500 500" fill="none" stroke="#2c2218" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M260 250 C290.8 250.0 405.0 240.8 445 250 C485.0 259.2 490.8 263.3 500 305 C509.2 346.7 500.0 467.5 500 500" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M260 250 C290.8 250.0 405.0 240.8 445 250 C485.0 259.2 490.8 263.3 500 305 C509.2 346.7 500.0 467.5 500 500" fill="none" stroke="#463020" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity=".32"/>
      </g></g>
  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9"><path d="M260 250 L361.8 250.0" marker-end="url(#arrow)"/></g>
  <g font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle">
      <circle cx="260" cy="250" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="260" y="257" fill="#5f472a">1</text></g>
  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#36271a">Resh ר</text>
  <text x="360" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b5943">Transliteration: r • 1 strokes • calligraphic teaching form</text>
</svg>