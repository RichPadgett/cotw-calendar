<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"
 role="img" aria-labelledby="title desc">
  <title id="title">Animated Modern Hebrew Final Tsadi</title>
  <desc id="desc">Calligraphic teaching animation rendered with the shared Hebrew alphabet visual system.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2"
                    seed="143" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M280 250 C290.0 269.2 321.7 328.3 340 365 C358.3 401.7 381.7 452.5 390 470" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal2">
      <path d="M470 250 C461.7 270.0 438.3 333.3 420 370 C401.7 406.7 370.0 453.3 360 470" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="1.57s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal3">
      <path d="M390 470 L380 550" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="2.79s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>

  <rect width="720" height="720" fill="#f7f1e5"/>

  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>

  <g opacity=".13"><path d="M280 250 C290.0 269.2 321.7 328.3 340 365 C358.3 401.7 381.7 452.5 390 470" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M470 250 C461.7 270.0 438.3 333.3 420 370 C401.7 406.7 370.0 453.3 360 470" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 470 L380 550" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M280 250 C290.0 269.2 321.7 328.3 340 365 C358.3 401.7 381.7 452.5 390 470" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M280 250 C290.0 269.2 321.7 328.3 340 365 C358.3 401.7 381.7 452.5 390 470" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M280 250 C290.0 269.2 321.7 328.3 340 365 C358.3 401.7 381.7 452.5 390 470" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal2)">
        <path d="M470 250 C461.7 270.0 438.3 333.3 420 370 C401.7 406.7 370.0 453.3 360 470" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M470 250 C461.7 270.0 438.3 333.3 420 370 C401.7 406.7 370.0 453.3 360 470" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M470 250 C461.7 270.0 438.3 333.3 420 370 C401.7 406.7 370.0 453.3 360 470" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal3)">
        <path d="M390 470 L380 550" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M390 470 L380 550" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M390 470 L380 550" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g></g>

  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9">
    <path d="M280 250 L313.0 313.2" marker-end="url(#arrow)"/><path d="M470 250 L442.5 316.0" marker-end="url(#arrow)"/><path d="M390 470 L384.5 514.0" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    
      <circle cx="280" cy="250" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="280" y="257" fill="#5f472a">1</text>
      <circle cx="470" cy="250" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="470" y="257" fill="#5f472a">2</text>
      <circle cx="390" cy="470" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="390" y="477" fill="#5f472a">3</text>
  </g>

  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif"
        font-size="30" fill="#36271a">Final Tsadi ץ</text>
  <text x="360" y="654" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="16" fill="#6b5943">Modern Hebrew block script • ṣ • 3 strokes</text>
</svg>