<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"
 role="img" aria-labelledby="title desc">
  <title id="title">Animated Modern Hebrew Nun</title>
  <desc id="desc">Calligraphic teaching animation rendered with the shared Hebrew alphabet visual system.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2"
                    seed="39" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M320 250 C338.3 250.0 411.7 225.0 430 250 C448.3 275.0 430.0 375.0 430 400" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal2">
      <path d="M430 400 C424.2 416.7 416.7 483.3 395 500 C373.3 516.7 315.8 500.0 300 500" fill="none" stroke="white" stroke-width="76"
            stroke-linecap="round" stroke-linejoin="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0"
                 dur="1.02s" begin="1.57s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>

  <rect width="720" height="720" fill="#f7f1e5"/>

  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>

  <g opacity=".13"><path d="M320 250 C338.3 250.0 411.7 225.0 430 250 C448.3 275.0 430.0 375.0 430 400" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 400 C424.2 416.7 416.7 483.3 395 500 C373.3 516.7 315.8 500.0 300 500" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M320 250 C338.3 250.0 411.7 225.0 430 250 C448.3 275.0 430.0 375.0 430 400" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M320 250 C338.3 250.0 411.7 225.0 430 250 C448.3 275.0 430.0 375.0 430 400" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M320 250 C338.3 250.0 411.7 225.0 430 250 C448.3 275.0 430.0 375.0 430 400" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g>
      <g mask="url(#reveal2)">
        <path d="M430 400 C424.2 416.7 416.7 483.3 395 500 C373.3 516.7 315.8 500.0 300 500" fill="none" stroke="#24170f" stroke-width="48"
              stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>
        <path d="M430 400 C424.2 416.7 416.7 483.3 395 500 C373.3 516.7 315.8 500.0 300 500" fill="none" stroke="#24170f" stroke-width="42"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M430 400 C424.2 416.7 416.7 483.3 395 500 C373.3 516.7 315.8 500.0 300 500" fill="none" stroke="#4a3221" stroke-width="27"
              stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>
      </g></g>

  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9">
    <path d="M320 250 L380.5 250.0" marker-end="url(#arrow)"/><path d="M430 400 L410.8 455.0" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    
      <circle cx="320" cy="250" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="320" y="257" fill="#5f472a">1</text>
      <circle cx="430" cy="400" r="18" fill="#f7f1e5"
              stroke="#8a6a3c" stroke-width="3"/>
      <text x="430" y="407" fill="#5f472a">2</text>
  </g>

  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif"
        font-size="30" fill="#36271a">Nun נ</text>
  <text x="360" y="654" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="16" fill="#6b5943">Modern Hebrew block script • n • 2 strokes</text>
</svg>