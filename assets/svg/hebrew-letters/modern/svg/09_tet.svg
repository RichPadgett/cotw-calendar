<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Animated Hebrew Tet</title>
  <desc id="desc">Educational Hebrew calligraphic animation with sequential broad-pen stroke order.</desc>
  <defs>
    <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="33" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <mask id="reveal1">
      <path d="M275 260 C275.0 291.7 265.8 410.0 275 450 C284.2 490.0 302.5 491.7 330 500 C357.5 508.3 413.3 508.3 440 500 C466.7 491.7 481.7 478.3 490 450 C498.3 421.7 490.0 350.0 490 330" fill="none" stroke="white" stroke-width="72" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.33s" begin="0.35s" fill="freeze"/>
      </path>
    </mask>
    <mask id="reveal2">
      <path d="M490 330 C480.0 316.7 455.0 263.3 430 250 C405.0 236.7 361.7 241.7 340 250 C318.3 258.3 306.7 291.7 300 300" fill="none" stroke="white" stroke-width="72" stroke-linecap="round"
            pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.09s" begin="1.86s" fill="freeze"/>
      </path>
    </mask>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a6a3c"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#f7f1e5"/>
  <g opacity=".30" stroke="#947f61" stroke-width="2">
    <line x1="110" y1="180" x2="610" y2="180"/>
    <line x1="110" y1="535" x2="610" y2="535"/>
    <line x1="360" y1="130" x2="360" y2="575" stroke-dasharray="8 10"/>
  </g>
  <g opacity=".13"><path d="M275 260 C275.0 291.7 265.8 410.0 275 450 C284.2 490.0 302.5 491.7 330 500 C357.5 508.3 413.3 508.3 440 500 C466.7 491.7 481.7 478.3 490 450 C498.3 421.7 490.0 350.0 490 330" fill="none" stroke="#2c2218" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 330 C480.0 316.7 455.0 263.3 430 250 C405.0 236.7 361.7 241.7 340 250 C318.3 258.3 306.7 291.7 300 300" fill="none" stroke="#2c2218" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#inkSoft)">
      <g mask="url(#reveal1)">
        <path d="M275 260 C275.0 291.7 265.8 410.0 275 450 C284.2 490.0 302.5 491.7 330 500 C357.5 508.3 413.3 508.3 440 500 C466.7 491.7 481.7 478.3 490 450 C498.3 421.7 490.0 350.0 490 330" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M275 260 C275.0 291.7 265.8 410.0 275 450 C284.2 490.0 302.5 491.7 330 500 C357.5 508.3 413.3 508.3 440 500 C466.7 491.7 481.7 478.3 490 450 C498.3 421.7 490.0 350.0 490 330" fill="none" stroke="#463020" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity=".32"/>
      </g>
      <g mask="url(#reveal2)">
        <path d="M490 330 C480.0 316.7 455.0 263.3 430 250 C405.0 236.7 361.7 241.7 340 250 C318.3 258.3 306.7 291.7 300 300" fill="none" stroke="#24170f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M490 330 C480.0 316.7 455.0 263.3 430 250 C405.0 236.7 361.7 241.7 340 250 C318.3 258.3 306.7 291.7 300 300" fill="none" stroke="#463020" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity=".32"/>
      </g></g>
  <g fill="none" stroke="#8a6a3c" stroke-width="4" opacity=".9"><path d="M275 260 L275.0 364.5" marker-end="url(#arrow)"/><path d="M490 330 L457.0 286.0" marker-end="url(#arrow)"/></g>
  <g font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle">
      <circle cx="275" cy="260" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="275" y="267" fill="#5f472a">1</text>
      <circle cx="490" cy="330" r="18" fill="#f7f1e5" stroke="#8a6a3c" stroke-width="3"/>
      <text x="490" y="337" fill="#5f472a">2</text></g>
  <text x="360" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#36271a">Tet ט</text>
  <text x="360" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b5943">Transliteration: ṭ • 2 strokes • calligraphic teaching form</text>
</svg>